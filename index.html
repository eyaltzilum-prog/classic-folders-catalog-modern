<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>קטלוג תעודות מחזור | Classic Folders</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Assistant', system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
    .header { position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,0.92); backdrop-filter: blur(8px); border-bottom: 1px solid #e2e8f0; }
    .header-inner { max-width: 1280px; margin: 0 auto; padding: 16px; display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .title { font-size: 1.75rem; font-weight: 800; margin: 0; }
    .subtitle { font-size: 0.875rem; color: #64748b; margin: 4px 0 0; }
    .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 9999px; color: white; text-decoration: none; font-size: 0.875rem; font-weight: 600; }
    .btn-blue { background: #2563eb; }
    .btn-green { background: #22c55e; }
    .hero { background: linear-gradient(135deg, #eff6ff, #eef2ff); padding: 48px 16px; text-align: center; }
    .hero h2 { font-size: 2.25rem; font-weight: 900; margin: 0 0 16px; }
    .hero p { font-size: 1.125rem; color: #475569; margin: 0 0 24px; }
    .search-wrap { position: relative; max-width: 28rem; margin: 0 auto; }
    .search { width: 100%; padding: 12px 16px 12px 48px; border: 1px solid #e2e8f0; border-radius: 1rem; font-size: 1.125rem; }
    .search-icon { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); color: #94a3b8; }
    .grid { max-width: 1280px; margin: 0 auto; padding: 40px 16px; display: grid; grid-template-columns: 1fr; gap: 24px; }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 1280px) { .grid { grid-template-columns: repeat(4, 1fr); } }
    .card { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; overflow: hidden; box-shadow: 0 1px 2px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.3s; }
    .card:hover { box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
    .card img { width: 100%; height: 200px; object-fit: cover; display: block; }
    .card-body { padding: 16px; }
    .card h3 { margin: 0 0 4px; font-size: 1.125rem; font-weight: 700; }
    .code { color: #2563eb; font-size: 0.875rem; font-weight: 600; }
    .desc { color: #475569; font-size: 0.875rem; margin-top: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .footer { background: #0f172a; color: white; text-align: center; padding: 40px 16px; margin-top: 40px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 50; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal.open { display: flex; }
    .modal-inner { background: white; border-radius: 1rem; max-width: 56rem; width: 100%; max-height: 90vh; overflow: auto; }
    .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; border-bottom: 1px solid #e2e8f0; }
    .modal img { width: 100%; max-height: 60vh; object-fit: contain; background: #f8fafc; }
    .thumbs { display: flex; gap: 8px; padding: 16px; overflow-x: auto; }
    .thumbs img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 2px solid transparent; }
    .thumbs img.active { border-color: #2563eb; }
    .close { background: none; border: none; font-size: 1.5rem; cursor: pointer; padding: 8px; }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <h1 class="title">קטלוג תעודות מחזור</h1>
        <p class="subtitle">עיצוב מודרני • מגוון רחב</p>
      </div>
      <div>
        <a href="tel:0522573846" class="btn btn-blue">📞 התקשרו</a>
        <a href="https://wa.me/972522573846?text=שלום%2C%20אשמח%20לפרטים%20על%20תעודות%20מחזור" target="_blank" class="btn btn-green" style="margin-right:8px;">💬 וואטסאפ</a>
      </div>
    </div>
  </header>
  <section class="hero">
    <h2>תעודות מחזור יפות ומודרניות</h2>
    <p>מגוון עיצובים לישראליות, אחדות, ירושלים, גיבורי על ועוד — לכל גן ילדים ובית ספר</p>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search" id="search" placeholder="חפשו לפי שם, קוד או תיאור...">
    </div>
  </section>
  <main class="grid" id="grid"></main>
  <footer class="footer">
    <p>לפרטים והזמנות</p>
    <p><a href="tel:035032512" style="color:white;">משרד: 03-5032512</a> · <a href="tel:0522573846" style="color:white;">נייד: 052-2573846</a></p>
    <p style="font-size:0.875rem; color:#94a3b8; margin-top:24px;">קטלוג מודרני • כל המוצרים זהים למקור</p>
  </footer>
  <div class="modal" id="modal">
    <div class="modal-inner">
      <div class="modal-header">
        <h2 id="modal-title"></h2>
        <button class="close" id="close">✕</button>
      </div>
      <img id="modal-img" alt="">
      <div class="thumbs" id="thumbs"></div>
      <p id="modal-desc" style="padding:16px; color:#334155;"></p>
    </div>
  </div>
  <script>
    const PRODUCTS = [
      { id: "item-3", name: "ישראל 01", code: null, images: ["https://page.frontcld.com/files/G3DPB8/ws27dvmjyl.jpg"], gallery: [], description: "ישראל 01" },
      { id: "item-4", name: "ישראל 02", code: null, images: ["https://page.frontcld.com/files/G3DPB8/lg3w2chdlh.jpg"], gallery: [], description: "ישראל 02" },
      { id: "1235", name: "תעודה 1235", code: "1235", images: ["https://page.frontcld.com/files/G3DPB8/pjawdekihk.jpg"], gallery: ["https://lp.landing-page.mobi/uploads/users/1034462/16518306206274ef5c99e94.jpg", "https://lp.landing-page.mobi/uploads/users/1034462/16518306286274ef6449916.jpg"], description: "תעודה קוד: 1235" },
      { id: "1236", name: "תעודה 1236", code: "1236", images: ["https://page.frontcld.com/files/G3DPB8/rvzepsn9r6.png"], gallery: ["https://page.frontcld.com/files/G3DPB8/qwqnqkuc81.jpg", "https://page.frontcld.com/files/G3DPB8/0rduoyeyy1.jpg"], description: "תעודה קוד: 1236" },
      { id: "1237", name: "תעודה 1237", code: "1237", images: ["https://page.frontcld.com/files/G3DPB8/zent65lhhq.png"], gallery: ["https://page.frontcld.com/files/G3DPB8/fif1tha9fu.jpg", "https://page.frontcld.com/files/G3DPB8/m7qip8j91s.jpg", "https://page.frontcld.com/files/G3DPB8/3jgerz0m01.jpg"], description: "תעודה קוד: 1237 גיבורי על" },
      { id: "1238", name: "תעודה 1238", code: "1238", images: ["https://lp.landing-page.mobi/uploads/users/1034462/1652631032628125f8be051.jpg"], gallery: ["https://lp.landing-page.mobi/uploads/users/1034462/16526311006281263c41895.jpg", "https://lp.landing-page.mobi/uploads/users/1034462/16526310956281263754388.jpg"], description: "תעודה קוד: 1238" }
    ];
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalImg = document.getElementById('modal-img');
    const thumbs = document.getElementById('thumbs');
    const modalDesc = document.getElementById('modal-desc');
    let currentImages = [];
    let currentIndex = 0;
    function render(products) {
      grid.innerHTML = products.map(p => {
        const img = p.images[0] || p.gallery[0] || '';
        return `<div class="card" data-id="${p.id}">
          ${img ? `<img src="${img}" alt="${p.name}" loading="lazy">` : ''}
          <div class="card-body">
            <h3>${p.name}</h3>
            ${p.code ? `<div class="code">קוד: ${p.code}</div>` : ''}
            ${p.description ? `<div class="desc">${p.description}</div>` : ''}
          </div>
        </div>`;
      }).join('');
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('click', () => openModal(card.dataset.id));
      });
    }
    function openModal(id) {
      const p = PRODUCTS.find(x => x.id === id);
      if (!p) return;
      currentImages = [...p.images, ...p.gallery].filter(Boolean);
      currentIndex = 0;
      modalTitle.textContent = p.name + (p.code ? ` (קוד ${p.code})` : '');
      modalDesc.textContent = p.description || '';
      updateModalImage();
      thumbs.innerHTML = currentImages.map((src, i) => `<img src="${src}" class="${i===0?'active':''}" data-i="${i}">`).join('');
      thumbs.querySelectorAll('img').forEach(img => {
        img.addEventListener('click', () => {
          currentIndex = +img.dataset.i;
          updateModalImage();
          thumbs.querySelectorAll('img').forEach(t => t.classList.remove('active'));
          img.classList.add('active');
        });
      });
      modal.classList.add('open');
    }
    function updateModalImage() {
      if (currentImages[currentIndex]) modalImg.src = currentImages[currentIndex];
    }
    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      const filtered = PRODUCTS.filter(p => p.name.toLowerCase().includes(q) || (p.code && p.code.includes(q)) || (p.description && p.description.toLowerCase().includes(q)));
      render(filtered);
    });
    document.getElementById('close').addEventListener('click', () => modal.classList.remove('open'));
    modal.addEventListener('click', e => { if (e.target === modal) modal.classList.remove('open'); });
    render(PRODUCTS);
  </script>
</body>
</html>
